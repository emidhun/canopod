[package]
name = "canopy"
version = "0.5.0"
description = "Canopy — lightweight git worktree and dev-service manager"
authors = ["Midhun Kumar"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "canopy"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "canopy-backend"
path = "src/backend_main.rs"

[lib]
name = "canopy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-log", "dep:tauri-plugin-positioner", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification", "dep:tauri-nspanel", "dep:fix-path-env"]
# Headless test harness (WTM_SUITE / WTM_SELFTEST / WTM_SELFTEST_CREATE).
# Excluded from release builds: it ships ~400 lines of env-var-triggered code
# that can create/remove worktrees and panics on malformed input.
devtools = []

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
# rolling file log in the app log dir — the thing a bug report can attach.
# Desktop uses `log`; the backend CLI logger and test harness write stderr.
log = "0.4"
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order: provision `keys` and user config files round-trip in the
# order the user wrote them instead of being alphabetized
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "signal"] }
# rev-pinned: an unpinned git dependency isn't reproducible and a force-push
# upstream would silently change what we ship
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673", optional = true }
sysinfo = "0.39.3"
# Match Tauri's platform paths without linking a desktop runtime.
dirs = "6"
# non-poisoning locks: with std, one panic while holding a lock poisons it and
# every later .unwrap() panics forever — the app survives as a zombie window.
parking_lot = "0.12"
# two Canopy instances would sweep each other's live pgids as "orphans" and
# race on settings/state writes — a second launch focuses the first instead.
tauri-plugin-single-instance = { version = "2", optional = true }
# embedded per-worktree terminals: a real PTY per session (the agent lane runs
# the coding-agent CLI inside one). portable-pty is cross-platform (helps Linux).
portable-pty = "0.9"
base64 = "0.23"
# OS notifications for the states that need a human while Canopy is in the
# tray — a crashed service, a blocked agent, a finished setup.
tauri-plugin-notification = { version = "2", optional = true }
# One HTTPS GET, twice a day, to ask GitHub whether a newer release exists.
# rustls rather than the platform TLS stack so the Linux build needs no extra
# system package, and default features off so this stays a client, not a server.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }

# POSIX process control (process groups, killpg, localtime_r). On Windows the
# equivalent lives in the `windows` crate below (Job Objects). See src/proc.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows process control: POSIX process groups have no direct equivalent, so
# each spawned service tree is wrapped in a Job Object (KILL_ON_JOB_CLOSE) and
# torn down with TerminateJobObject. See src/proc.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Time",
] }

# macOS-only: the tray popover is a non-activating NSPanel. Other platforms fall
# back to a plain borderless window (see src/tray.rs).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6", version = "2.1.0", optional = true }
