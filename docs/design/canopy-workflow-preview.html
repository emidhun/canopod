<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canopy workspace flow preview</title><link rel="stylesheet" href="/src/styles/tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-primary);font:14px var(--sans)}button,input,textarea{font:inherit}button{cursor:pointer;color:var(--text-secondary);background:none;border:1px solid transparent;border-radius:var(--r-md);padding:0 8px;min-height:24px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}button:hover{background:var(--btn)}button[aria-pressed=true]{background:var(--btn-hover);color:var(--text-primary)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--action-primary);outline-offset:2px}.primary{background:var(--action-primary);color:var(--action-primary-ink)}.muted{color:var(--text-secondary);font-size:12px}.mono{font-family:var(--mono)}.top,.nav,.sessions,.context,.logtools{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--divider);flex-wrap:wrap}.top{background:var(--surface-float)}.top strong{font-weight:500}.grow{flex:1}.preview{font-size:12px;color:var(--action-primary)}.nav{min-height:42px}.nav .split{margin-left:auto;border-color:var(--divider);background:var(--surface-well)}.sessions{background:var(--surface-well);min-height:38px}.sessions button{font-size:12px}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--state-running)}.wait{background:var(--state-attention)}.ended{background:var(--state-idle)}.context{font-size:12px;min-height:36px}.context button{color:var(--text-secondary);padding:0}.work{display:grid;grid-template-columns:minmax(0,1fr);min-height:430px}.work.split{grid-template-columns:minmax(0,var(--working-width,60fr)) 5px minmax(0,var(--logs-width,40fr))}.divider{background:var(--divider);cursor:col-resize;touch-action:none}.divider:hover,.divider:focus-visible{background:var(--action-primary);outline:none}.pane{min-width:0}.companion{border-left:1px solid var(--divider)}.empty{max-width:420px;margin:60px auto;padding:0 24px}.empty h2{font-size:16px;font-weight:500;margin:0 0 10px}.empty p{line-height:1.5;color:var(--text-secondary);margin:0 0 20px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.outline{border-color:var(--divider);background:var(--surface-well)}.profile{position:relative;display:inline-flex}.menu{position:absolute;top:calc(100% + 4px);right:0;width:180px;background:var(--surface-float);border:1px solid var(--border);border-radius:var(--r-pop);box-shadow:var(--shadow-pop);padding:4px;z-index:10}.menu button{width:100%;text-align:left;justify-content:flex-start;min-height:28px}.menu .check{width:14px;color:var(--action-primary)}.logtools{font-size:12px;padding:6px 10px}.logtools input{border:1px solid var(--divider);background:var(--surface-well);color:var(--text-primary);border-radius:var(--r-md);padding:4px 8px;min-width:80px;width:120px}.logs{padding:10px 14px;font:12px/1.8 var(--mono);overflow-wrap:anywhere}.logs .line{display:flex;gap:12px}.logs .time{color:var(--text-tertiary);flex:none}.logs .err{color:var(--state-error);background:var(--red-wash)}.logs .ok{color:var(--state-running)}.pausebar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--divider);font-size:12px;background:var(--surface-well)}.agentbody{padding:20px}.agentbody h2{font-size:14px;font-weight:500;margin:0 0 12px}.agentbody p{line-height:1.6;margin:12px 0;color:var(--text-secondary)}.agentbody .message{padding:14px;background:var(--surface-well);border-radius:var(--r-md)}.agentbody textarea{width:100%;resize:vertical;min-height:72px;border:1px solid var(--divider);border-radius:var(--r-md);padding:10px;background:var(--surface-well);color:var(--text-primary);margin:12px 0}.terminal{padding:16px;font:12px/1.8 var(--mono)}.terminal .prompt{display:flex;align-items:center;gap:8px}.terminal input{flex:1;min-width:0;border:0;padding:4px 0;background:none;color:var(--text-primary);font:inherit}.return{padding:40px 24px;max-width:420px;margin:auto}.endedbar{border-top:1px solid var(--divider);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12px}.foot{padding:8px 14px;border-top:1px solid var(--divider);color:var(--text-tertiary);font-size:12px;display:flex;gap:10px}.task{padding:12px 14px;background:var(--surface-well);border-bottom:1px solid var(--divider)}.task label{display:grid;gap:8px}.task input{border:1px solid var(--divider);background:var(--surface-app);color:var(--text-primary);padding:6px 8px;border-radius:var(--r-md)}[hidden]{display:none!important}@media(max-width:700px){.work.split{grid-template-columns:minmax(0,1fr)}.companion{border-left:0;border-top:1px solid var(--divider)}.divider{display:none}.empty{margin:32px auto}.logtools input{flex:1}.sessions{gap:4px}.sessions .grow{display:none}.work{min-height:360px}}
</style></head>
<body><div id="flow"><header class="top"><strong>Canopy</strong><span class="muted">acme-web</span><span class="mono">feature/checkout</span><span class="grow"></span><span class="preview">Proposed flow · sample sessions</span></header><nav class="nav" aria-label="Workspace view"><button data-view="logs" aria-pressed="false">Logs</button><button data-view="terminal" aria-pressed="false">Terminal</button><button data-view="agent" aria-pressed="true">Agent</button><button id="split" class="split" aria-pressed="false">Logs alongside</button></nav><div id="sessions" class="sessions" hidden></div><div id="context" class="context"><button id="context-toggle" aria-expanded="false">Task context</button><span id="task-title">Fix checkout validation</span><span class="grow"></span><button id="edit-task">Edit task</button></div><div id="task-editor" class="task" hidden><label>Task title<input id="task-input" value="Fix checkout validation"></label><p class="muted">feature/checkout · checkout_dev · Frontend :3010 · Server :4010</p><button id="save-task" class="outline">Save task</button></div><main id="work" class="work"></main><footer class="foot"><span>feature/checkout</span><span class="grow"></span><span id="foot-state">Agent</span></footer></div>
<script>
(()=>{const root=document.getElementById('flow');let view='agent',profile='Claude',contextOpen=false,task='Fix checkout validation',paused=false,newLines=12;const alongside={agent:false,terminal:false};const sessions={agent:[],terminal:[]};const active={agent:null,terminal:null};let serial=0;const proportions={agent:60,terminal:60};
const el=id=>root.querySelector('#'+id),escape=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const selected=()=>sessions[view]?.find(s=>s.id===active[view]);
function add(kind,name){const s={id:++serial,title:name,state:kind==='agent'?'waiting':'running',detached:false,output:[]};sessions[kind].push(s);active[kind]=s.id;render();}
function menu(button,choices,choose){const old=button.parentElement.querySelector('.menu');if(old){old.remove();return}const box=document.createElement('div');box.className='menu';box.setAttribute('role','dialog');box.setAttribute('aria-label',button.classList.contains('source')?'Choose service':button.classList.contains('levels')?'Choose log levels':'Choose agent');for(const name of choices){const b=document.createElement('button');b.innerHTML='<span class="check">'+(name===button.textContent.replace(/\s*▾$/, '').trim()?'✓':'')+'</span>'+escape(name);b.onclick=()=>{box.remove();choose?.(name)};box.append(b)}button.parentElement.append(box)}
function logs(){return '<section class="pane '+(view!=='logs'?'companion':'')+'" aria-label="Service logs"><div class="logtools"><span class="profile"><button class="outline source">All services ▾</button></span><span class="profile"><button class="outline levels">Levels ▾</button></span><input class="search" aria-label="Search logs" placeholder="Search logs…"><span class="grow"></span><button class="follow" aria-pressed="'+!paused+'">'+(paused?'Paused':'Follow')+'</button></div>'+(paused?'<div class="pausebar">Paused · '+newLines+' new lines<span class="grow"></span><button class="latest outline">Return to latest</button></div>':'')+'<div class="logs"><div class="line"><span class="time">09:42:01</span><span class="ok">Frontend · compiled successfully</span></div><div class="line"><span class="time">09:42:03</span><span>Server · GET /api/checkout 200</span></div><div class="line err"><span class="time">09:42:05</span><span>Server · ValidationError: shipping address missing</span></div><div class="line"><span class="time">09:42:06</span><span>Server · request rejected with status 422</span></div></div><div class="actions" style="padding:0 14px 14px">'+(view==='agent'?'':'<button class="review-error outline">Open agent alongside</button>')+'<button class="older">Read earlier output</button></div></section>'}
function body(){const s=selected();if(!s)return '<section class="pane"><div class="empty"><h2>'+(view==='agent'?'Start an agent for this task':'Open a terminal here')+'</h2><p>'+(view==='agent'?'Choose an agent and start working in this branch. Task context is ready above.':'A shell opens in this worktree. Existing agent sessions keep running.')+'</p><div class="actions">'+(view==='agent'?'<span class="profile"><button class="outline pick-agent">'+escape(profile)+' ▾</button></span><button class="primary start">Start agent</button>':'<button class="primary start">Open terminal</button>')+'</div></div></section>';if(s.detached)return '<section class="pane"><div class="return"><h2>Session is in a separate window</h2><p class="muted">'+escape(s.title)+' keeps running there.</p><button class="outline bring-back">Bring back</button></div></section>';const ended=s.state==='ended'?'<div class="endedbar">Session ended · output is kept<span class="grow"></span><button class="outline restart">Restart</button><button class="close-ended">Close</button></div>':'';return '<section class="pane">'+(view==='agent'?'<div class="terminal"><div class="muted">'+escape(s.title)+' · '+escape(task)+'</div><div>Agent CLI · branch and runtime context loaded</div><br><div>I found the checkout validation error.</div><div>The form allows an empty address; the server requires it.</div><br><div>'+(s.state==='waiting'?'Ready to update CheckoutDrawer.tsx and run checkout tests.':s.state==='ended'?'Session ended. Output is retained.':'Updating validation and running checkout tests…')+'</div>'+s.output.map(t=>'<div>'+escape(t)+'</div>').join('')+'<br><label class="prompt"><span class="muted">'+(s.state==='waiting'?'Reply ❯':'Agent ❯')+'</span><input class="command" aria-label="Agent terminal input" placeholder="Reply in the agent terminal" '+(s.state==='ended'?'disabled':'')+'></label><button class="outline end-demo">End demo session</button></div>' :'<div class="terminal"><div class="muted">'+escape(s.title)+' · ~/code/acme-web/.worktrees/checkout</div><div>Canopy shell · worktree environment loaded</div>'+s.output.map(t=>'<div>'+escape(t)+'</div>').join('')+'<label class="prompt"><span class="muted">checkout ❯</span><input class="command" aria-label="Terminal command" placeholder="Try pnpm test" '+(s.state==='ended'?'disabled':'')+'></label><button class="outline end-demo">End demo session</button></div>')+ended+'</section>'}
function render(){root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));el('split').hidden=view==='logs';el('split').setAttribute('aria-pressed',String(!!alongside[view]));el('context').hidden=view!=='agent';el('task-editor').hidden=view!=='agent'||!contextOpen;el('context-toggle').setAttribute('aria-expanded',String(contextOpen));el('task-title').textContent=task;el('foot-state').textContent=view==='logs'?'Logs':view==='agent'?'Agent':'Terminal';const ss=sessions[view]||[],s=selected();el('sessions').hidden=view==='logs'||!ss.length;el('sessions').innerHTML=ss.map(x=>'<button class="session" data-id="'+x.id+'" aria-pressed="'+(s?.id===x.id)+'"><span class="dot '+(x.state==='waiting'?'wait':x.state==='ended'?'ended':'')+'"></span>'+escape(x.title)+'<span class="muted">'+(x.state==='waiting'?'Waiting':x.state==='ended'?'Ended':'Running')+'</span></button>').join('')+'<span class="grow"></span><button class="outline new-session">'+(view==='agent'?'New agent':'New terminal')+'</button><button class="pop-out">Pop out</button>';el('work').className='work'+(view!=='logs'&&alongside[view]?' split':'');el('work').innerHTML=view==='logs'?logs():body();syncSplit();bind();}
function syncSplit(){const work=el('work');work.classList.toggle('split',view!=='logs'&&alongside[view]);work.style.setProperty('--working-width',proportions[view]+'fr');work.style.setProperty('--logs-width',(100-proportions[view])+'fr');work.querySelector('.divider')?.remove();work.querySelector('.companion')?.remove();if(view==='logs'||!alongside[view])return;work.insertAdjacentHTML('beforeend','<div class="divider" role="separator" tabindex="0" aria-label="Resize working pane" aria-orientation="vertical" aria-valuemin="35" aria-valuemax="75" aria-valuenow="'+proportions[view]+'"></div>'+logs());const divider=work.querySelector('.divider');const resize=value=>{proportions[view]=Math.max(35,Math.min(75,value));work.style.setProperty('--working-width',proportions[view]+'fr');work.style.setProperty('--logs-width',(100-proportions[view])+'fr');divider.setAttribute('aria-valuenow',Math.round(proportions[view]))};divider.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();resize(proportions[view]+(e.key==='ArrowRight'?2:-2))}};divider.onpointerdown=e=>{divider.setPointerCapture(e.pointerId);divider.onpointermove=event=>{const rect=work.getBoundingClientRect();resize((event.clientX-rect.left)/rect.width*100)};divider.onpointerup=()=>{divider.onpointermove=null}};}
function bind(){root.querySelectorAll('.session').forEach(b=>b.onclick=()=>{active[view]=Number(b.dataset.id);render()});root.querySelectorAll('.start,.new-session').forEach(b=>b.onclick=()=>add(view,view==='agent'?profile+(sessions.agent.length?' '+(sessions.agent.length+1):''):'Terminal '+(sessions.terminal.length+1)));root.querySelectorAll('.pick-agent').forEach(b=>b.onclick=()=>menu(b,['Claude','Codex'],name=>{profile=name;render()}));root.querySelectorAll('.pop-out').forEach(b=>b.onclick=()=>{selected().detached=true;render()});root.querySelectorAll('.bring-back').forEach(b=>b.onclick=()=>{selected().detached=false;render()});root.querySelectorAll('.end-demo').forEach(b=>b.onclick=()=>{selected().state='ended';render()});root.querySelectorAll('.restart').forEach(b=>b.onclick=()=>{selected().state=view==='agent'?'waiting':'running';render()});root.querySelectorAll('.close-ended').forEach(b=>b.onclick=()=>{sessions[view]=sessions[view].filter(x=>x.id!==active[view]);active[view]=sessions[view].at(-1)?.id;render()});root.querySelectorAll('.send').forEach(b=>b.onclick=()=>{selected().state='running';render()});root.querySelectorAll('.command').forEach(b=>b.onkeydown=e=>{if(e.key==='Enter'&&b.value.trim()){selected().output.push('❯ '+b.value,view==='agent'?'Continuing with the requested changes…':'✓ checkout tests passed · 12 tests');if(view==='agent')selected().state='running';render();root.querySelector('.command')?.focus()}});root.querySelectorAll('.follow,.older').forEach(b=>b.onclick=()=>{paused=b.classList.contains('older')?true:!paused;render()});root.querySelectorAll('.latest').forEach(b=>b.onclick=()=>{paused=false;newLines=0;render()});root.querySelectorAll('.review-error').forEach(b=>b.onclick=()=>{view='agent';alongside.agent=true;render()});root.querySelectorAll('.search').forEach(b=>b.oninput=()=>{b.closest('.pane').querySelectorAll('.line').forEach(l=>l.hidden=!l.textContent.toLowerCase().includes(b.value.toLowerCase()))});root.querySelectorAll('.source').forEach(b=>b.onclick=()=>menu(b,['All services','Frontend','Server'],name=>{b.textContent=name+' ▾';b.closest('.pane').querySelectorAll('.line').forEach(l=>l.hidden=name!=='All services'&&!l.textContent.includes(name))}));root.querySelectorAll('.levels').forEach(b=>b.onclick=()=>menu(b,['All levels','Errors only'],name=>{b.textContent=name+' ▾';b.closest('.pane').querySelectorAll('.line').forEach(l=>l.hidden=name==='Errors only'&&!l.classList.contains('err'))}));}
root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});el('split').onclick=()=>{alongside[view]=!alongside[view];el('split').setAttribute('aria-pressed',String(alongside[view]));syncSplit();bind()};el('context-toggle').onclick=el('edit-task').onclick=()=>{contextOpen=!contextOpen;render()};el('save-task').onclick=()=>{task=el('task-input').value.trim()||'Untitled task';contextOpen=false;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape')root.querySelectorAll('.menu').forEach(m=>m.remove())});document.addEventListener('mousedown',e=>{root.querySelectorAll('.menu').forEach(m=>{if(!m.parentElement.contains(e.target))m.remove()})});render();})();
</script></body></html>
