<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canopod UI review</title><link rel="stylesheet" href="/src/styles/tokens.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-primary);font:14px var(--sans);height:100vh;display:flex;flex-direction:column}header{padding:14px 18px;border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:16px}h1{font-size:16px;margin:0}header a{margin-left:auto;color:var(--action-primary);text-decoration:none;font-size:12px;white-space:nowrap}header span{color:var(--text-secondary);font-size:12px}.body{display:flex;flex:1;min-height:0}nav{width:205px;flex:none;overflow:auto;padding:12px;border-right:1px solid var(--divider);background:var(--surface-nav)}h2{font-size:11px;color:var(--text-tertiary);margin:18px 8px 8px;text-transform:uppercase;letter-spacing:.08em}button{display:block;width:100%;text-align:left;border:0;border-radius:var(--r-md);padding:8px;background:none;color:var(--text-secondary);cursor:pointer;font:13px var(--sans)}button:hover{background:var(--btn)}button[aria-pressed=true]{background:var(--btn-hover);color:var(--action-primary)}button:focus-visible{outline:2px solid var(--action-primary)}iframe{flex:1;min-width:0;border:0;background:var(--surface-app)}@media(max-width:800px){nav{width:165px}header span{display:none}}
</style></head><body><header><h1>Canopod UI review</h1><span>Live implementation · sample data · select a screen to inspect</span><a id="fullsize" href="/" target="_blank" rel="noopener">Open full size ↗</a></header><div class="body"><nav id="screens" aria-label="Review screens"></nav><iframe id="preview" title="Canopod live preview" src="/"></iframe></div><script>
const groups=[['Workspace',[['Toolbar & popups','/']]],['Proposed flow',[['Unified Terminal','/docs/design/canopod-unified-terminal-preview.html'],['Separate Agent & Terminal','/docs/design/canopod-workflow-preview.html']]],['Application settings',[['General','general'],['MCP','mcp'],['Terminal','terminal'],['Notifications','notifications'],['Shortcuts','shortcuts'],['Security','security'],['Advanced','advanced']]],['Repository settings',[['General','repo-general'],['Services','services'],['Agents','agents'],['Commands','commands'],['Files','files'],['Setup','setup']]],['Database',[['Database tools','database'],['Restore to new database','restore'],['Replace from dump','replace']]],['Uncommitted changes',[['Commit','commit'],['Stash','stash'],['Discard','discard']]]];
const nav=document.getElementById('screens'),frame=document.getElementById('preview');for(const [group,items] of groups){const h=document.createElement('h2');h.textContent=group;nav.append(h);for(const[label,id]of items){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(id==='/'));b.onclick=()=>{for(const x of nav.querySelectorAll('button'))x.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed','true');frame.src=group==='Proposed flow'?id:id==='/'?'/':group==='Uncommitted changes'?'/?changes-demo=1&changes-mode='+id:group==='Database'?(id==='database'?'/?review=database':'/?review=restore&restore-mode='+(id==='replace'?'replace':'create')):'/?review=settings&page='+id;document.getElementById('fullsize').href=frame.src;};nav.append(b);}}
</script></body></html>
