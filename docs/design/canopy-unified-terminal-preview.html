<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canopy unified terminal preview</title><link rel="stylesheet" href="/src/styles/tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--surface-app);color:var(--text-primary);font:14px var(--sans)}button,input,textarea{font:inherit}button{cursor:pointer;color:var(--text-secondary);background:none;border:1px solid transparent;border-radius:var(--r-md);padding:0 8px;min-height:24px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}button:hover{background:var(--btn)}button[aria-pressed=true]{background:var(--btn-hover);color:var(--text-primary)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--action-primary);outline-offset:2px}.primary{background:var(--action-primary);color:var(--action-primary-ink)}.muted{color:var(--text-secondary);font-size:12px}.mono{font-family:var(--mono)}.top,.nav,.sessions,.context,.logtools{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--divider);flex-wrap:wrap}.top{background:var(--surface-float)}.top strong{font-weight:500}.grow{flex:1}.preview{font-size:12px;color:var(--action-primary)}.nav{min-height:42px}.nav .split{margin-left:auto;border-color:var(--divider);background:var(--surface-well)}.sessions{background:var(--surface-well);min-height:38px}.sessions button{font-size:12px}.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--state-running)}.wait{background:var(--state-attention)}.ended{background:var(--state-idle)}.context{font-size:12px;min-height:36px}.context button{color:var(--text-secondary);padding:0}.work{display:grid;grid-template-columns:minmax(0,1fr);min-height:430px}.work.split{grid-template-columns:minmax(0,var(--working-width,60fr)) 5px minmax(0,var(--logs-width,40fr))}.divider{background:var(--divider);cursor:col-resize;touch-action:none}.divider:hover,.divider:focus-visible{background:var(--action-primary);outline:none}.pane{min-width:0}.companion{border-left:1px solid var(--divider)}.empty{max-width:420px;margin:60px auto;padding:0 24px}.empty h2{font-size:16px;font-weight:500;margin:0 0 10px}.empty p{line-height:1.5;color:var(--text-secondary);margin:0 0 20px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.outline{border-color:var(--divider);background:var(--surface-well)}.profile{position:relative;display:inline-flex}.menu{position:absolute;top:calc(100% + 4px);right:0;width:180px;background:var(--surface-float);border:1px solid var(--border);border-radius:var(--r-pop);box-shadow:var(--shadow-pop);padding:4px;z-index:10}.menu button{width:100%;text-align:left;justify-content:flex-start;min-height:28px}.menu .check{width:14px;color:var(--action-primary)}.logtools{font-size:12px;padding:6px 10px}.logtools input{border:1px solid var(--divider);background:var(--surface-well);color:var(--text-primary);border-radius:var(--r-md);padding:4px 8px;min-width:80px;width:120px}.logs{padding:10px 14px;font:12px/1.8 var(--mono);overflow-wrap:anywhere}.logs .line{display:flex;gap:12px}.logs .time{color:var(--text-tertiary);flex:none}.logs .err{color:var(--state-error);background:var(--red-wash)}.logs .ok{color:var(--state-running)}.pausebar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--divider);font-size:12px;background:var(--surface-well)}.agentbody{padding:20px}.agentbody h2{font-size:14px;font-weight:500;margin:0 0 12px}.agentbody p{line-height:1.6;margin:12px 0;color:var(--text-secondary)}.agentbody .message{padding:14px;background:var(--surface-well);border-radius:var(--r-md)}.agentbody textarea{width:100%;resize:vertical;min-height:72px;border:1px solid var(--divider);border-radius:var(--r-md);padding:10px;background:var(--surface-well);color:var(--text-primary);margin:12px 0}.terminal{padding:16px;font:12px/1.8 var(--mono)}.terminal .prompt{display:flex;align-items:center;gap:8px}.terminal input{flex:1;min-width:0;border:0;padding:4px 0;background:none;color:var(--text-primary);font:inherit}.return{padding:40px 24px;max-width:420px;margin:auto}.endedbar{border-top:1px solid var(--divider);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12px}.foot{padding:8px 14px;border-top:1px solid var(--divider);color:var(--text-tertiary);font-size:12px;display:flex;gap:10px}.task{padding:12px 14px;background:var(--surface-well);border-bottom:1px solid var(--divider)}.task label{display:grid;gap:8px}.task input{border:1px solid var(--divider);background:var(--surface-app);color:var(--text-primary);padding:6px 8px;border-radius:var(--r-md)}[hidden]{display:none!important}@media(max-width:700px){.work.split{grid-template-columns:minmax(0,1fr)}.companion{border-left:0;border-top:1px solid var(--divider)}.divider{display:none}.empty{margin:32px auto}.logtools input{flex:1}.sessions{gap:4px}.sessions .grow{display:none}.work{min-height:360px}}

/* Match Canopy’s compact toolbar, menu and session conventions. */
#flow{min-height:100vh;display:flex;flex-direction:column}.work{flex:1;min-height:360px}.nav,.sessions,.context{padding-inline:14px;gap:6px}.nav{min-height:38px}.sessions{min-height:36px;flex-wrap:nowrap}.sessions .session{flex-shrink:0}.session-list{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:thin}.session{height:24px;border:1px solid var(--divider);background:var(--surface-well)}.session[aria-pressed=true]{border-color:var(--action-primary);background:var(--btn-hover)}.add-session{width:24px;height:24px;padding:0;justify-content:center;font-size:16px}.pop-out{height:24px;font-size:12px}.context{background:var(--surface-app)}.logtools{display:grid;grid-template-columns:auto auto minmax(70px,1fr) auto;gap:4px;align-items:center;padding:6px 10px}.logtools button,.logtools input{height:24px;min-height:24px;font-size:12px}.logtools input{width:100%;padding:0 6px;min-width:0}.logtools .grow{display:none}.logtools .outline{border-color:transparent}.menu button{font-size:12px;height:28px;padding:0 8px}.menu .check:empty{display:none}.terminal{padding:14px}.terminal .prompt{margin-top:6px}.logs{padding:8px 10px}.logs .line{gap:8px}.logs .line>span:last-child{min-width:0}.logs .err{color:var(--red-text)}.pausebar{padding:6px 10px;gap:6px;flex-wrap:wrap}.foot{min-height:28px;padding:4px 14px}.end-demo{font:12px var(--sans);margin-top:10px}.empty{margin:48px auto}.empty p{margin-bottom:16px}.companion{border-left:0}.divider{background:transparent;border-inline:1px solid var(--divider)}
@media(max-width:700px){.work.split{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(260px,auto) minmax(220px,auto)}.logtools{grid-template-columns:auto auto minmax(70px,1fr) auto}.sessions .grow{display:block}.empty{margin:32px auto}.companion{border-top:1px solid var(--divider)}}
@media(max-width:360px){.logtools{grid-template-columns:auto auto 1fr}.logtools input{grid-row:2;grid-column:1/-1}.preview{display:none}}
</style></head>
<body><div id="flow"><header class="top"><strong>Canopy</strong><span class="muted">acme-web</span><span class="mono">feature/checkout</span><span class="grow"></span><span class="preview">Proposed flow · sample sessions</span></header><nav class="nav" aria-label="Workspace view"><button data-view="logs" aria-pressed="false">Logs</button><button data-view="terminal" aria-pressed="true">Terminal</button><button id="split" class="split" aria-pressed="false">Logs alongside</button></nav><div id="sessions" class="sessions" hidden></div><div id="context" class="context"><button id="context-toggle" aria-expanded="false">Task context</button><span id="task-title">Fix checkout validation</span><span class="grow"></span><button id="edit-task">Edit task</button></div><div id="task-editor" class="task" hidden><label>Task title<input id="task-input" value="Fix checkout validation"></label><p class="muted">feature/checkout · checkout_dev · Frontend :3010 · Server :4010</p><button id="save-task" class="outline">Save task</button></div><main id="work" class="work"></main><footer class="foot"><span>feature/checkout</span><span class="grow"></span><span id="foot-state">Agent</span></footer></div>
<script>
(()=>{const root=document.getElementById('flow');let view='terminal',profile='Claude',contextOpen=false,task='Fix checkout validation',paused=false,newLines=12;const alongside={agent:false,terminal:false};const sessions={terminal:[]};const active={terminal:null};let serial=0;const filters={source:'All services',level:'All levels',search:''};const proportions={agent:60,terminal:60};
const el=id=>root.querySelector('#'+id),escape=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const selected=()=>sessions.terminal.find(s=>s.id===active.terminal);const isAgent=()=>view!=='logs'&&selected()?.kind==='agent';
function add(kind,name){const s={id:++serial,kind,title:name,state:kind==='agent'?'waiting':'running',detached:false,output:[]};sessions.terminal.push(s);active.terminal=s.id;view='terminal';render();}
function menu(button,choices,choose){const old=button.parentElement.querySelector('.menu');if(old){old.remove();return}const box=document.createElement('div');box.className='menu';box.setAttribute('role','dialog');box.setAttribute('aria-label',button.classList.contains('source')?'Choose service':button.classList.contains('levels')?'Choose log levels':'Add session');for(const name of choices){const b=document.createElement('button');b.innerHTML='<span class="check">'+(!button.classList.contains('add-session')&&name===button.textContent.replace(/\s*▾$/, '').trim()?'✓':'')+'</span>'+escape(name);b.onclick=()=>{box.remove();button.setAttribute('aria-expanded','false');button.focus();choose?.(name)};box.append(b)}button.parentElement.append(box);focusMenu(button,box)}
function logs(){return '<section class="pane '+(view!=='logs'?'companion':'')+'" aria-label="Service logs"><div class="logtools"><span class="profile"><button class="outline source">'+escape(filters.source)+' ▾</button></span><span class="profile"><button class="outline levels">'+(filters.level==='All levels'?'Levels':escape(filters.level))+' ▾</button></span><input class="search" value="'+escape(filters.search)+'" aria-label="Search logs" placeholder="Search logs…"><span class="grow"></span><button class="follow" aria-pressed="'+!paused+'">'+(paused?'Paused':'Follow')+'</button></div>'+(paused?'<div class="pausebar">Paused · '+newLines+' new lines<span class="grow"></span><button class="latest outline">Return to latest</button></div>':'')+'<div class="logs"><div class="line"><span class="time">09:42:01</span><span class="ok">Frontend · compiled successfully</span></div><div class="line"><span class="time">09:42:03</span><span>Server · GET /api/checkout 200</span></div><div class="line err"><span class="time">09:42:05</span><span>Server · ValidationError: shipping address missing</span></div><div class="line"><span class="time">09:42:06</span><span>Server · request rejected with status 422</span></div></div><div class="actions" style="padding:0 14px 14px">'+(isAgent()?'':'<button class="review-error outline">Open agent alongside</button>')+'<button class="older">Read earlier output</button></div></section>'}
function body(){const s=selected();if(!s)return '<section class="pane"><div class="empty"><h2>Start working in this terminal</h2><p>Open Claude with this worktree’s context, or start a shell here.</p><div class="actions"><button class="primary start-agent">Start agent</button><button class="outline start-terminal">Open terminal</button></div><p class="muted" style="margin-top:12px">Agent profile: Claude</p></div></section>' ;if(s.detached)return '<section class="pane"><div class="return"><h2>Session is in a separate window</h2><p class="muted">'+escape(s.title)+' keeps running there.</p><button class="outline bring-back">Bring back</button></div></section>';const ended=s.state==='ended'?'<div class="endedbar">Session ended · output is kept<span class="grow"></span><button class="outline restart">Restart</button><button class="close-ended">Close</button></div>':'';return '<section class="pane">'+(isAgent()?'<div class="terminal"><div class="muted">'+escape(s.title)+' · '+escape(task)+'</div><div>Agent CLI · branch and runtime context loaded</div><br><div>I found the checkout validation error.</div><div>The form allows an empty address; the server requires it.</div><br><div>'+(s.state==='waiting'?'Ready to update CheckoutDrawer.tsx and run checkout tests.':s.state==='ended'?'Session ended. Output is retained.':'Updating validation and running checkout tests…')+'</div>'+s.output.map(t=>'<div>'+escape(t)+'</div>').join('')+'<br><label class="prompt"><span class="muted">'+(s.state==='waiting'?'Reply ❯':'Agent ❯')+'</span><input class="command" aria-label="Agent terminal input" placeholder="Reply in the agent terminal" '+(s.state==='ended'?'disabled':'')+'></label><button class="outline end-demo">End demo session</button></div>' :'<div class="terminal"><div class="muted">'+escape(s.title)+' · ~/code/acme-web/.worktrees/checkout</div><div>Canopy shell · worktree environment loaded</div>'+s.output.map(t=>'<div>'+escape(t)+'</div>').join('')+'<label class="prompt"><span class="muted">checkout ❯</span><input class="command" aria-label="Terminal command" placeholder="Try pnpm test" '+(s.state==='ended'?'disabled':'')+'></label><button class="outline end-demo">End demo session</button></div>')+ended+'</section>'}
function render(){root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));el('split').hidden=view==='logs';el('split').setAttribute('aria-pressed',String(!!alongside[view]));el('context').hidden=!isAgent();el('task-editor').hidden=!isAgent()||!contextOpen;el('context-toggle').setAttribute('aria-expanded',String(contextOpen));el('task-title').textContent=task;el('foot-state').textContent=view==='logs'?'Logs':'Terminal';const ss=sessions[view]||[],s=selected();el('sessions').hidden=view==='logs';el('sessions').innerHTML='<div class="session-list">'+ss.map(x=>'<button class="session" data-id="'+x.id+'" aria-pressed="'+(s?.id===x.id)+'"><span class="dot '+(x.state==='waiting'?'wait':x.state==='ended'?'ended':'')+'"></span>'+(x.kind==='agent'?'✧ ':'›_ ')+escape(x.title)+'<span class="muted">'+(x.state==='waiting'?'Waiting':x.state==='ended'?'Ended':'Running')+'</span></button>').join('')+'</div><span class="grow"></span><span class="profile"><button class="outline add-session" aria-label="Add session" aria-haspopup="dialog">+</button></span>'+(s?'<button class="pop-out">Pop out</button>':'');el('work').className='work'+(view!=='logs'&&alongside[view]?' split':'');el('work').innerHTML=view==='logs'?logs():body();syncSplit();bind();}
function syncSplit(){const work=el('work');work.classList.toggle('split',view!=='logs'&&alongside[view]);work.style.setProperty('--working-width',proportions[view]+'fr');work.style.setProperty('--logs-width',(100-proportions[view])+'fr');work.querySelector('.divider')?.remove();work.querySelector('.companion')?.remove();if(view==='logs'||!alongside[view])return;work.insertAdjacentHTML('beforeend','<div class="divider" role="separator" tabindex="0" aria-label="Resize working pane" aria-orientation="vertical" aria-valuemin="35" aria-valuemax="75" aria-valuenow="'+proportions[view]+'"></div>'+logs());const divider=work.querySelector('.divider');const resize=value=>{proportions[view]=Math.max(35,Math.min(75,value));work.style.setProperty('--working-width',proportions[view]+'fr');work.style.setProperty('--logs-width',(100-proportions[view])+'fr');divider.setAttribute('aria-valuenow',Math.round(proportions[view]))};divider.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();resize(proportions[view]+(e.key==='ArrowRight'?2:-2))}};divider.onpointerdown=e=>{divider.setPointerCapture(e.pointerId);divider.onpointermove=event=>{const rect=work.getBoundingClientRect();resize((event.clientX-rect.left)/rect.width*100)};divider.onpointerup=()=>{divider.onpointermove=null}};}
function bind(){root.querySelectorAll('.session').forEach(b=>b.onclick=()=>{active[view]=Number(b.dataset.id);render()});root.querySelectorAll('.start-agent').forEach(b=>b.onclick=()=>add('agent','Claude'+(sessions.terminal.filter(s=>s.kind==='agent').length?' '+(sessions.terminal.filter(s=>s.kind==='agent').length+1):'')));root.querySelectorAll('.start-terminal').forEach(b=>b.onclick=()=>add('terminal','Terminal '+(sessions.terminal.filter(s=>s.kind==='terminal').length+1)));root.querySelectorAll('.add-session').forEach(b=>b.onclick=()=>menu(b,['Start agent','Open terminal'],name=>add(name==='Start agent'?'agent':'terminal',name==='Start agent'?'Claude'+(sessions.terminal.filter(s=>s.kind==='agent').length?' '+(sessions.terminal.filter(s=>s.kind==='agent').length+1):''):'Terminal '+(sessions.terminal.filter(s=>s.kind==='terminal').length+1))));root.querySelectorAll('.pop-out').forEach(b=>b.onclick=()=>{selected().detached=true;render()});root.querySelectorAll('.bring-back').forEach(b=>b.onclick=()=>{selected().detached=false;render()});root.querySelectorAll('.end-demo').forEach(b=>b.onclick=()=>{selected().state='ended';render()});root.querySelectorAll('.restart').forEach(b=>b.onclick=()=>{selected().state=isAgent()?'waiting':'running';render()});root.querySelectorAll('.close-ended').forEach(b=>b.onclick=()=>{sessions[view]=sessions[view].filter(x=>x.id!==active[view]);active[view]=sessions[view].at(-1)?.id;render()});root.querySelectorAll('.send').forEach(b=>b.onclick=()=>{selected().state='running';render()});root.querySelectorAll('.command').forEach(b=>b.onkeydown=e=>{if(e.key==='Enter'&&b.value.trim()){selected().output.push('❯ '+b.value,isAgent()?'Continuing with the requested changes…':'✓ checkout tests passed · 12 tests');if(isAgent())selected().state='running';render();root.querySelector('.command')?.focus()}});root.querySelectorAll('.follow,.older').forEach(b=>b.onclick=()=>{paused=b.classList.contains('older')?true:!paused;render()});root.querySelectorAll('.latest').forEach(b=>b.onclick=()=>{paused=false;newLines=0;render()});root.querySelectorAll('.review-error').forEach(b=>b.onclick=()=>{view='terminal';alongside.terminal=true;render()});root.querySelectorAll('.search').forEach(b=>b.oninput=()=>{filters.search=b.value;filterLogs()});root.querySelectorAll('.source').forEach(b=>b.onclick=()=>menu(b,['All services','Frontend','Server'],name=>{filters.source=name;b.textContent=name+' ▾';filterLogs()}));root.querySelectorAll('.levels').forEach(b=>b.onclick=()=>menu(b,['All levels','Errors only'],name=>{filters.level=name;b.textContent=(name==='All levels'?'Levels':name)+' ▾';filterLogs()}));filterLogs();
}
function filterLogs(){root.querySelectorAll('.logs .line').forEach(l=>l.hidden=(filters.source!=='All services'&&!l.textContent.includes(filters.source))||(filters.level==='Errors only'&&!l.classList.contains('err'))||!l.textContent.toLowerCase().includes(filters.search.toLowerCase()));}
function focusMenu(button,box){button.setAttribute('aria-expanded','true');box.querySelector('button')?.focus();box.onkeydown=e=>{const items=[...box.querySelectorAll('button')],index=items.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();items[e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus()}if(e.key==='Escape'){box.remove();button.setAttribute('aria-expanded','false');button.focus()}};}
root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});el('split').onclick=()=>{alongside[view]=!alongside[view];el('split').setAttribute('aria-pressed',String(alongside[view]));syncSplit();bind()};el('context-toggle').onclick=el('edit-task').onclick=()=>{contextOpen=!contextOpen;render()};el('save-task').onclick=()=>{task=el('task-input').value.trim()||'Untitled task';contextOpen=false;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape')root.querySelectorAll('.menu').forEach(m=>m.remove())});document.addEventListener('mousedown',e=>{root.querySelectorAll('.menu').forEach(m=>{if(!m.parentElement.contains(e.target))m.remove()})});render();})();
</script></body></html>
