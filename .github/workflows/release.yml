# Release — build installers on a version tag (v0.4.0 → draft GitHub release).
# macOS: .app + .dmg (arm64). Linux: .deb / .AppImage / .rpm. Windows: NSIS .exe
# (untested ports — artifacts are published so early adopters can try them).
name: release

on:
  push:
    tags: ["v*"]

# the default GITHUB_TOKEN is read-only on new repos; tauri-action needs to
# create the release and upload assets
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json
          - platform: ubuntu-latest
            args: --config src-tauri/tauri.release.conf.json
          - platform: windows-latest
            args: --config src-tauri/tauri.release.conf.json
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system deps (linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            curl wget file libxdo-dev libssl-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Canopy ${{ github.ref_name }}"
          releaseDraft: true
          uploadUpdaterJson: true
          retryAttempts: 2
          args: ${{ matrix.args }}
      - name: Collect packages for smoke checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          destination = Path('release-packages')
          destination.mkdir(exist_ok=True)
          for source in Path('src-tauri/target').glob('**/bundle/**/*'):
              if source.is_file() and source.name.endswith(('.dmg', '.app.tar.gz', '.deb', '.rpm', '.AppImage', '.exe', '.msi')):
                  shutil.copy2(source, destination / source.name)
          PY
      - name: Smoke macOS packages
        if: matrix.platform == 'macos-latest'
        run: bash scripts/release-smoke/macos.sh release-packages "${GITHUB_REF_NAME#v}"
      - name: Smoke Linux packages
        if: matrix.platform == 'ubuntu-latest'
        run: |
          bash scripts/release-smoke/linux.sh deb release-packages "${GITHUB_REF_NAME#v}"
          bash scripts/release-smoke/linux.sh appimage release-packages "${GITHUB_REF_NAME#v}"
          docker run --rm -v "$PWD:/workspace" -w /workspace fedora:43 bash scripts/release-smoke/linux.sh rpm release-packages "${GITHUB_REF_NAME#v}"
      - name: Smoke Windows packages
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          ./scripts/release-smoke/windows.ps1 -Kind nsis -Packages release-packages -ExpectedVersion $version
          ./scripts/release-smoke/windows.ps1 -Kind msi -Packages release-packages -ExpectedVersion $version
